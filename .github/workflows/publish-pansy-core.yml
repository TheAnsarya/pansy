name: Publish Pansy.Core NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (defaults to csproj Version)
        required: false
        type: string
  release:
    types: [published]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          csproj_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Pansy.Core/Pansy.Core.csproj | head -n 1)
          if [ -z "$csproj_version" ]; then
            echo "Failed to determine package version."
            exit 1
          fi

          echo "value=$csproj_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Pansy.sln -c Release --nologo -v m

      - name: Test
        run: dotnet test tests/Pansy.Core.Tests -c Release --nologo -v m

      - name: Pack Pansy.Core
        run: |
          mkdir -p artifacts/nupkg
          dotnet pack src/Pansy.Core/Pansy.Core.csproj -c Release -o artifacts/nupkg \
            /p:Version=${{ steps.ver.outputs.value }} \
            /p:ContinuousIntegrationBuild=true \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

      - name: Push package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is missing."
            exit 1
          fi

          dotnet nuget push artifacts/nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pansy.Core.NuGet
          path: artifacts/nupkg/

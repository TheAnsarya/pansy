<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<defs>
		<radialGradient id="petal" cx="50%" cy="50%">
			<stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
		</radialGradient>
		<radialGradient id="center" cx="50%" cy="50%">
			<stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
		</radialGradient>
	</defs>
	
	<!-- Flower petals (5 petals in a circle) -->
	<ellipse cx="50" cy="25" rx="15" ry="20" fill="url(#petal)" transform="rotate(0 50 50)"/>
	<ellipse cx="50" cy="25" rx="15" ry="20" fill="url(#petal)" transform="rotate(72 50 50)"/>
	<ellipse cx="50" cy="25" rx="15" ry="20" fill="url(#petal)" transform="rotate(144 50 50)"/>
	<ellipse cx="50" cy="25" rx="15" ry="20" fill="url(#petal)" transform="rotate(216 50 50)"/>
	<ellipse cx="50" cy="25" rx="15" ry="20" fill="url(#petal)" transform="rotate(288 50 50)"/>
	
	<!-- Center -->
	<circle cx="50" cy="50" r="12" fill="url(#center)"/>
</svg>

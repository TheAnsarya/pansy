<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<radialGradient id="petal-small" cx="50%" cy="50%">
			<stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
		</radialGradient>
		<radialGradient id="center-small" cx="50%" cy="50%">
			<stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
		</radialGradient>
	</defs>
	
	<!-- Flower petals -->
	<ellipse cx="32" cy="16" rx="10" ry="13" fill="url(#petal-small)" transform="rotate(0 32 32)"/>
	<ellipse cx="32" cy="16" rx="10" ry="13" fill="url(#petal-small)" transform="rotate(72 32 32)"/>
	<ellipse cx="32" cy="16" rx="10" ry="13" fill="url(#petal-small)" transform="rotate(144 32 32)"/>
	<ellipse cx="32" cy="16" rx="10" ry="13" fill="url(#petal-small)" transform="rotate(216 32 32)"/>
	<ellipse cx="32" cy="16" rx="10" ry="13" fill="url(#petal-small)" transform="rotate(288 32 32)"/>
	
	<!-- Center -->
	<circle cx="32" cy="32" r="8" fill="url(#center-small)"/>
</svg>
